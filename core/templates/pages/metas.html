{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <h1>Minhas Metas</h1>

    <form method="POST" style="margin-top: 20px; margin-bottom: 30px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #f2b705; color: #000; padding: 10px; border: none; cursor: pointer; border-radius: 5px;">
            Adicionar Meta
        </button>
    </form>

    <hr style="border-color: #333;">

    {% if metas %}
        <ul style="list-style-type: none; padding: 0;">
            {% for meta in metas %}
                <li style="background: #2c2c2c; padding: 15px; margin-bottom: 10px; border-radius: 5px; color: #fff;">
                    {{ meta.titulo }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p style="color: #888;">Nenhuma meta cadastrada ainda.</p>
    {% endif %}
</div>
{% endblock %}
