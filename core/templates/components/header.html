{% load static %}
<header class="app-header">
  <!-- O header é compartilhado pelas páginas autenticadas; evite criar outra marca em uma página filha. -->
  <div class="app-header__brand">
    <button id="menu-toggle" class="icon-btn" aria-label="Abrir menu" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <svg class="logo-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 5.5C4.8 4.4 7 4 9 4c1.7 0 3.4.4 4.5 1.2V19c-1.1-.8-2.8-1.2-4.5-1.2-2 0-4.2.4-6 1.5V5.5z" />
      <path d="M22 5.5c-1.8-1.1-4-1.5-6-1.5-1.7 0-3.4.4-4.5 1.2V19c1.1-.8 2.8-1.2 4.5-1.2 2 0 4.2.4 6 1.5V5.5z" />
    </svg>
    <span class="wordmark"><span class="brand-name">Meta</span><span class="brand-accent">Estudo</span></span>
  </div>

  <div class="app-header__actions">
    {% include 'components/theme_toggle.html' %}

    <a class="avatar" href="{% url 'conta' %}" title="Abrir minha conta" aria-label="Abrir minha conta">{{ request.user.first_name|default:request.user.username|first|upper }}</a>
  </div>
</header>
